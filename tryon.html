<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>虛擬試戴（POC） · LOHAS 樂活眼鏡</title>
  <link rel="icon" href="favicon.svg" />
  <style>
    :root{
      --bg:#0d0d0d; --panel:#161616; --line:#2a2a2a;
      --txt:#f5f5f5; --muted:#9a9a9a; --accent:#c8a15a;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:"Noto Sans TC",system-ui,-apple-system,sans-serif;
      background:var(--bg);color:var(--txt);
      min-height:100vh;display:flex;flex-direction:column;align-items:center;
      padding:24px 16px 48px;
    }
    h1{font-size:1.4rem;font-weight:700;letter-spacing:1px;margin-bottom:4px}
    .sub{color:var(--muted);font-size:.85rem;margin-bottom:20px;text-align:center;line-height:1.7}
    .modeTabs{display:flex;gap:8px;margin-bottom:16px}
    .modeTabs .chip{min-width:120px;text-align:center}
    .stage{
      position:relative;width:100%;max-width:640px;aspect-ratio:4/3;
      background:#000;border-radius:16px;overflow:hidden;border:1px solid var(--line);
    }
    #video,#overlay{position:absolute;inset:0;width:100%;height:100%}
    #video{object-fit:cover;transform:scaleX(-1);display:none}
    #overlay{z-index:2;object-fit:contain}
    .hint{
      position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:6px;
      text-align:center;padding:24px;color:var(--muted);font-size:.9rem;line-height:1.8;
      background:rgba(0,0,0,.55);backdrop-filter:blur(2px);
    }
    .hint.hidden{display:none}
    .controls{width:100%;max-width:640px;margin-top:20px}
    .row{margin-bottom:16px}
    .row .label{font-size:.8rem;color:var(--muted);margin-bottom:8px;letter-spacing:1px}
    .opts{display:flex;flex-wrap:wrap;gap:8px}
    .chip{
      border:1px solid var(--line);background:var(--panel);color:var(--txt);
      padding:8px 16px;border-radius:999px;font-size:.85rem;cursor:pointer;transition:.15s;
    }
    .chip:hover{border-color:var(--accent)}
    .chip.active{background:var(--accent);border-color:var(--accent);color:#111;font-weight:700}
    .swatch{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
    .swatch.active{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
    .btn{
      width:100%;max-width:640px;margin-top:8px;padding:14px;border:none;border-radius:12px;
      background:var(--accent);color:#111;font-weight:700;font-size:1rem;cursor:pointer;
    }
    .btn.secondary{background:transparent;border:1px solid var(--line);color:var(--txt)}
    .status{font-size:.78rem;color:var(--muted);margin-top:14px;text-align:center;min-height:1.2em}
    .slider{width:100%;accent-color:var(--accent)}
    small.note{color:#666}
  </style>
</head>
<body>
  <h1>虛擬試戴 <span style="color:var(--accent)">POC</span></h1>
  <p class="sub">概念驗證：偵測臉部 → 鏡框即時跟隨。<br/>鏡框為程式繪製，之後可替換為實際商品去背圖。</p>

  <div class="modeTabs">
    <button class="chip active" id="tabCamera">📷 即時相機</button>
    <button class="chip" id="tabPhoto">🖼️ 上傳照片</button>
  </div>

  <div class="stage">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div class="hint" id="hint">
      <div id="hintCamera">
        需要使用你的相機才能試戴。<br/>按下方「開始試戴」並允許相機權限。<br/>
        <small class="note">影像只在你的裝置本機處理，不會上傳。</small>
      </div>
      <div id="hintPhoto" style="display:none">
        沒有相機也能測。<br/>按下方「選擇照片」，上傳一張正面自拍。<br/>
        <small class="note">照片只在你的裝置本機處理，不會上傳。</small>
      </div>
    </div>
  </div>

  <button class="btn" id="startBtn">開始試戴</button>
  <button class="btn" id="photoBtn" style="display:none">選擇照片</button>
  <input type="file" id="fileInput" accept="image/*" style="display:none" />

  <div class="controls" id="panel" style="display:none">
    <div class="row">
      <div class="label">鏡框：1974-72065-BHJ · 轉頭同步（±45°）</div>
    </div>
    <div class="row">
      <label style="display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);cursor:pointer">
        <input type="checkbox" id="flipChk" /> 左右轉向相反時勾選
      </label>
    </div>
    <div class="row">
      <div class="label">尺寸微調 <span id="sizeVal" style="color:var(--accent)"></span></div>
      <input class="slider" id="sizeSlider" type="range" min="0.8" max="1.3" step="0.02" value="1" />
    </div>
    <div class="row">
      <div class="label">上下位置微調 <span id="offVal" style="color:var(--accent)"></span></div>
      <input class="slider" id="offSlider" type="range" min="-0.4" max="0.4" step="0.02" value="0" />
    </div>
    <div class="row">
      <div class="label">左右位置微調 <span id="hoffVal" style="color:var(--accent)"></span></div>
      <input class="slider" id="hoffSlider" type="range" min="-0.4" max="0.4" step="0.02" value="0.06" />
    </div>
    <button class="btn secondary" id="stopBtn">停止 / 重選</button>
  </div>

  <p class="status" id="status"></p>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');
    const stage = document.querySelector('.stage');
    const hint = document.getElementById('hint');
    const hintCamera = document.getElementById('hintCamera');
    const hintPhoto = document.getElementById('hintPhoto');
    const startBtn = document.getElementById('startBtn');
    const photoBtn = document.getElementById('photoBtn');
    const fileInput = document.getElementById('fileInput');
    const stopBtn = document.getElementById('stopBtn');
    const panel = document.getElementById('panel');
    const statusEl = document.getElementById('status');
    const sizeSlider = document.getElementById('sizeSlider');
    const sizeVal = document.getElementById('sizeVal');
    const tabCamera = document.getElementById('tabCamera');
    const tabPhoto = document.getElementById('tabPhoto');

    let frameStyle = 'real';
    let frameColor = '#1a1a1a';
    let sizeMul = 1;
    let vOffset = 0;              // 上下微調（以雙眼距離為單位）
    let hOffset = 0.06;           // 左右微調（以雙眼距離為單位）

    // 真實鏡框 yaw sprite：13 格（-45° .. 正面(第6格) .. +45°），每格 833x316
    // 錨點為單格內左右鏡片中心的比例位置
    const REAL = { src:'images/frame-72065-yaw.png', tileW:833, tileH:316, count:13, front:6,
                   lx:0.23, ly:0.48, rx:0.71, ry:0.48 };
    let tileIndex = REAL.front;   // 依 yaw 選出的目前影格
    let yawFlip = false;          // 左右轉向相反時翻轉
    const frameImg = new Image();
    let frameReady = false;
    frameImg.onload = ()=>{ frameReady = true; redrawPhoto(); };
    frameImg.src = REAL.src;

    // 由 FaceMesh landmarks 估算頭部左右轉動，換算成影格索引 0..count-1
    function updateTileFromYaw(lm){
      if(!lm){ tileIndex = REAL.front; return; }
      const nose = lm[1], reOuter = lm[33], leOuter = lm[263];
      const eyeMidX = (reOuter.x + leOuter.x)/2;
      const faceW = Math.abs(leOuter.x - reOuter.x) || 1e-6;
      let m = (nose.x - eyeMidX)/faceW;           // ~0 正面，±轉動
      const MAXM = 0.28;                          // 對應到 ±45°
      m = Math.max(-MAXM, Math.min(MAXM, m));
      let off = Math.round((m/MAXM) * (REAL.front)); // -6..+6
      if(mode==='camera') off = -off;             // 相機為鏡像
      if(yawFlip) off = -off;
      tileIndex = REAL.front + off;
      tileIndex = Math.max(0, Math.min(REAL.count-1, tileIndex));
    }
    let camera = null;
    let faceMesh = null;
    let mode = 'camera';            // 'camera' | 'photo'
    let lastLandmarks = null;       // 照片模式：偵測一次後暫存
    let photoImg = null;

    // --- 分頁切換 ---
    tabCamera.addEventListener('click', ()=>switchMode('camera'));
    tabPhoto.addEventListener('click', ()=>switchMode('photo'));
    function switchMode(m){
      if(m===mode) return;
      teardown();
      mode = m;
      tabCamera.classList.toggle('active', m==='camera');
      tabPhoto.classList.toggle('active', m==='photo');
      hintCamera.style.display = m==='camera' ? 'block' : 'none';
      hintPhoto.style.display  = m==='photo'  ? 'block' : 'none';
      startBtn.style.display = m==='camera' ? 'block' : 'none';
      photoBtn.style.display = m==='photo'  ? 'block' : 'none';
      stage.style.aspectRatio = '4/3';
      setStatus('');
    }

    // --- UI 綁定 ---
    sizeSlider.addEventListener('input', ()=>{
      sizeMul = parseFloat(sizeSlider.value);
      sizeVal.textContent = Math.round(sizeMul*100)+'%';
      redrawPhoto();
    });
    sizeVal.textContent = '100%';
    const offSlider = document.getElementById('offSlider');
    const offVal = document.getElementById('offVal');
    offSlider.addEventListener('input', ()=>{
      vOffset = parseFloat(offSlider.value);
      offVal.textContent = (vOffset>0?'+':'')+Math.round(vOffset*100)+'%';
      redrawPhoto();
    });
    offVal.textContent = '0%';
    const hoffSlider = document.getElementById('hoffSlider');
    const hoffVal = document.getElementById('hoffVal');
    hoffSlider.addEventListener('input', ()=>{
      hOffset = parseFloat(hoffSlider.value);
      hoffVal.textContent = (hOffset>0?'+':'')+Math.round(hOffset*100)+'%';
      redrawPhoto();
    });
    hoffVal.textContent = (hOffset>0?'+':'')+Math.round(hOffset*100)+'%';
    document.getElementById('flipChk').addEventListener('change', (e)=>{
      yawFlip = e.target.checked; redrawPhoto();
    });

    function setStatus(t){ statusEl.textContent = t; }

    async function ensureFaceMesh(){
      if(faceMesh) return faceMesh;
      faceMesh = new FaceMesh({locateFile:(f)=>'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/'+f});
      faceMesh.setOptions({maxNumFaces:1, refineLandmarks:true, minDetectionConfidence:0.5, minTrackingConfidence:0.5});
      faceMesh.onResults(onResults);
      return faceMesh;
    }

    // --- MediaPipe 回呼（相機與照片共用）---
    function onResults(results){
      const src = results.image;
      const W = src.width, H = src.height;
      overlay.width = W; overlay.height = H;
      stage.style.aspectRatio = (W/H).toString();

      ctx.save();
      ctx.clearRect(0,0,W,H);
      if(mode==='camera'){ ctx.translate(W,0); ctx.scale(-1,1); }  // 自拍鏡像
      ctx.drawImage(src, 0, 0, W, H);

      const lm = results.multiFaceLandmarks && results.multiFaceLandmarks[0];
      if(lm){
        if(mode==='photo') lastLandmarks = lm;
        updateTileFromYaw(lm);
        const leftEye  = avg([lm[33], lm[133]], W, H);
        const rightEye = avg([lm[362], lm[263]], W, H);
        drawFrame(leftEye, rightEye);
        const deg = Math.round((tileIndex-REAL.front)/REAL.front*45);
        setStatus((mode==='camera' ? '偵測到臉部 — 左右轉頭看鏡框角度變化' : '偵測到臉部 ✓ 影格')+`（約 ${deg>0?'+':''}${deg}°）`);
      } else {
        setStatus(mode==='camera' ? '沒偵測到臉，請正對鏡頭、光線充足' : '這張照片沒偵測到臉，換一張更正面、清楚的試試');
      }
      ctx.restore();
    }
    function avg(pts, W, H){
      let x=0,y=0; pts.forEach(p=>{x+=p.x;y+=p.y});
      return {x:(x/pts.length)*W, y:(y/pts.length)*H};
    }

    // 照片模式：改參數時用暫存的 landmarks 重畫（不必重新偵測）
    function redrawPhoto(){
      if(mode!=='photo' || !photoImg || !lastLandmarks) return;
      const W = photoImg.naturalWidth, H = photoImg.naturalHeight;
      overlay.width = W; overlay.height = H;
      ctx.save();
      ctx.clearRect(0,0,W,H);
      ctx.drawImage(photoImg, 0,0, W,H);
      updateTileFromYaw(lastLandmarks);
      const leftEye  = avg([lastLandmarks[33], lastLandmarks[133]], W, H);
      const rightEye = avg([lastLandmarks[362], lastLandmarks[263]], W, H);
      drawFrame(leftEye, rightEye);
      ctx.restore();
    }

    // 依款式分派：真實鏡框圖 或 程式繪製
    function drawFrame(L, R){
      if(frameStyle==='real'){
        if(frameReady) drawRealFrame(L, R);
        else setStatus('鏡框素材載入中…');
      } else {
        drawGlasses(L, R);
      }
    }

    // 用雙眼位置把 yaw sprite 的目前影格對齊貼上（相似變換：兩錨點 -> 兩眼中心）
    function drawRealFrame(L, R){
      const tw = REAL.tileW, thh = REAL.tileH;
      const sx = tileIndex * tw;                    // sprite 中此格的水平起點
      const s1 = {x:REAL.lx*tw, y:REAL.ly*thh};     // 單格內左右鏡片中心
      const s2 = {x:REAL.rx*tw, y:REAL.ry*thh};
      const eyeDist = Math.hypot(R.x-L.x, R.y-L.y);
      const srcDist = Math.hypot(s2.x-s1.x, s2.y-s1.y);
      const scale = eyeDist / srcDist;
      const ang = Math.atan2(R.y-L.y, R.x-L.x) - Math.atan2(s2.y-s1.y, s2.x-s1.x);
      const mx = (L.x+R.x)/2, my = (L.y+R.y)/2;
      ctx.save();
      // 尺寸與上下/左右微調（以雙眼中心為基準；相機為鏡像故左右反向）
      const hx = hOffset*eyeDist*(mode==='camera'?-1:1);
      ctx.translate(mx + hx, my + vOffset*eyeDist);
      ctx.scale(sizeMul, sizeMul);
      ctx.translate(-mx, -my);
      // 基礎相似變換：s1->L, s2->R
      ctx.translate(L.x, L.y);
      ctx.rotate(ang);
      ctx.scale(scale, scale);
      ctx.translate(-s1.x, -s1.y);
      // 只畫 sprite 中目前這一格
      ctx.drawImage(frameImg, sx, 0, tw, thh, 0, 0, tw, thh);
      ctx.restore();
    }

    // --- 繪製鏡框 ---
    function drawGlasses(L, R){
      const dx = R.x - L.x, dy = R.y - L.y;
      const eyeDist = Math.hypot(dx, dy);
      const angle = Math.atan2(dy, dx);
      const midX = (L.x + R.x)/2, midY = (L.y + R.y)/2;
      const lensR = eyeDist * 0.46 * sizeMul;
      const lensOffset = eyeDist/2;
      const lineW = Math.max(2, eyeDist*0.045);

      ctx.save();
      ctx.translate(midX, midY);
      ctx.rotate(angle);
      ctx.lineJoin = 'round';
      const tint = 'rgba(0,0,0,0.12)';

      function lens(sign){
        const ox = sign * lensOffset;
        ctx.beginPath();
        if(frameStyle==='round'){ ctx.arc(ox, 0, lensR, 0, Math.PI*2); }
        else if(frameStyle==='square'){ roundRect(ox-lensR, -lensR*0.8, lensR*2, lensR*1.6, lensR*0.28); }
        else if(frameStyle==='browline'){ roundRect(ox-lensR, -lensR*0.75, lensR*2, lensR*1.5, lensR*0.5); }
        else if(frameStyle==='cateye'){ catEye(ox, sign, lensR); }
        ctx.fillStyle = tint; ctx.fill();
        ctx.strokeStyle = frameColor; ctx.lineWidth = lineW; ctx.stroke();
        if(frameStyle==='browline'){
          ctx.beginPath(); ctx.lineWidth = lineW*2.2;
          ctx.moveTo(ox-lensR, -lensR*0.75); ctx.lineTo(ox+lensR, -lensR*0.75); ctx.stroke();
        }
      }
      lens(-1); lens(1);

      ctx.strokeStyle = frameColor; ctx.lineWidth = lineW;
      ctx.beginPath();
      ctx.moveTo(-lensOffset+lensR*0.55, -lensR*0.15);
      ctx.quadraticCurveTo(0, -lensR*0.4, lensOffset-lensR*0.55, -lensR*0.15);
      ctx.stroke();

      const templeY = -lensR*0.2;
      ctx.beginPath();
      ctx.moveTo(-lensOffset-lensR, templeY);
      ctx.lineTo(-lensOffset-lensR-eyeDist*0.5, templeY-eyeDist*0.05);
      ctx.moveTo(lensOffset+lensR, templeY);
      ctx.lineTo(lensOffset+lensR+eyeDist*0.5, templeY-eyeDist*0.05);
      ctx.stroke();
      ctx.restore();
    }
    function roundRect(x,y,w,h,r){
      ctx.moveTo(x+r,y);
      ctx.arcTo(x+w,y,x+w,y+h,r);
      ctx.arcTo(x+w,y+h,x,y+h,r);
      ctx.arcTo(x,y+h,x,y,r);
      ctx.arcTo(x,y,x+w,y,r);
      ctx.closePath();
    }
    function catEye(ox,sign,r){
      ctx.moveTo(ox-r, r*0.2);
      ctx.quadraticCurveTo(ox-r, -r*0.9, ox+(sign>0? r*0.2 : -r*0.2), -r*0.7);
      ctx.quadraticCurveTo(ox+r*1.15*sign, -r*1.05, ox+r*sign, -r*0.2);
      ctx.quadraticCurveTo(ox+r, r*0.8, ox, r*0.75);
      ctx.quadraticCurveTo(ox-r*0.7, r*0.7, ox-r, r*0.2);
      ctx.closePath();
    }

    // --- 相機模式 ---
    async function start(){
      setStatus('載入臉部偵測模型中…');
      startBtn.disabled = true;
      try{
        if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
          throw new Error('此瀏覽器不支援相機');
        }
        await ensureFaceMesh();
        video.style.display = 'block';
        camera = new Camera(video, {
          onFrame: async()=>{ await faceMesh.send({image:video}); },
          width:640, height:480
        });
        await camera.start();
        hint.classList.add('hidden');
        startBtn.style.display='none';
        panel.style.display='block';
        setStatus('相機已啟動');
      }catch(err){
        const msg = (err && err.name === 'NotFoundError') || /not found|device not found/i.test(err&&err.message||'')
          ? '找不到相機。你的裝置可能沒有鏡頭，或相機被其他程式佔用。請改用上方「🖼️ 上傳照片」，或換手機開啟。'
          : ('啟動失敗：'+ (err && err.message ? err.message : err));
        setStatus(msg);
        startBtn.disabled = false;
      }
    }

    // --- 照片模式 ---
    photoBtn.addEventListener('click', ()=>fileInput.click());
    fileInput.addEventListener('change', async (e)=>{
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      setStatus('載入臉部偵測模型中…');
      try{
        await ensureFaceMesh();
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = async ()=>{
          photoImg = img;
          hint.classList.add('hidden');
          photoBtn.style.display='none';
          panel.style.display='block';
          setStatus('偵測臉部中…');
          await faceMesh.send({image: img});   // 觸發 onResults（照片會暫存 landmarks）
          URL.revokeObjectURL(url);
        };
        img.onerror = ()=>setStatus('照片載入失敗，換一張試試');
        img.src = url;
      }catch(err){
        setStatus('處理失敗：'+ (err && err.message ? err.message : err));
      }
    });

    // --- 停止 / 拆除 ---
    function teardown(){
      if(camera){ try{camera.stop();}catch(e){} camera=null; }
      const s = video.srcObject; if(s){ s.getTracks().forEach(t=>t.stop()); }
      video.srcObject = null; video.style.display='none';
      photoImg = null; lastLandmarks = null;
      if(fileInput) fileInput.value = '';
      ctx.clearRect(0,0,overlay.width,overlay.height);
      panel.style.display='none';
      hint.classList.remove('hidden');
      startBtn.disabled=false;
    }
    stopBtn.addEventListener('click', ()=>{
      teardown();
      startBtn.style.display = mode==='camera' ? 'block' : 'none';
      photoBtn.style.display = mode==='photo'  ? 'block' : 'none';
      stage.style.aspectRatio = '4/3';
      setStatus('已停止');
    });
    startBtn.addEventListener('click', start);
  </script>
</body>
</html>
