<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客製眼鏡布 · LOHAS 樂活眼鏡</title>
  <meta name="description" content="挑一張刻圖,或自己畫幾筆,做一條只有你有的眼鏡布。">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- 上傳刻圖用的裁切工具(與刻圖市集同一組) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- LOHAS CSS · 載入順序: tokens → base → components → page -->
  <link rel="stylesheet" href="css/lohas-tokens.css">
  <link rel="stylesheet" href="css/lohas-base.css">
  <link rel="stylesheet" href="css/lohas-components.css">
  <link rel="stylesheet" href="css/upload-design.css?v=20260825-nozoom">
  <link rel="stylesheet" href="css/cloth.css?v=20260827-transform">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
</head>

<body class="cl">
<div id="site-header"></div>

<main class="cl-main">

  <div class="cl-head">
    <h1 class="cl-title">客製眼鏡布</h1>
    <div class="cl-title-line"></div>
  </div>

  <!-- ===== 來源切換(置頂)=====
       刻意放在 .cl-body 之外 —— 放在右欄裡的話,手機版它只能排在
       預覽下面,而「先決定圖從哪來」是這一頁的第一個動作。
       手機上釘在 header 底下,預覽再釘在它下面(見 cloth.css)。
       三個入口一律常駐,隨時想換都按得到。 -->
  <div class="cl-sourcebar" id="clSourceCard">
    <p class="cl-bar-title">圖案從哪裡來</p>
    <div class="cl-seg" id="clSource">
      <button type="button" class="cl-seg-btn on" data-src="market">
        <i class="fa-solid fa-shapes"></i><span>刻圖市集</span>
      </button>
      <button type="button" class="cl-seg-btn" data-src="draw">
        <i class="fa-solid fa-pencil"></i><span>自己畫</span>
      </button>
      <!-- 這一顆是「動作」不是「模式」(開一個視窗、做完就回來),
           所以沒有 data-src,按了不會停在某個狀態。 -->
      <button type="button" class="cl-seg-btn" id="clUpload">
        <i class="fa-solid fa-arrow-up-from-bracket"></i><span>上傳圖</span>
      </button>
    </div>
  </div>

  <div class="cl-body">

    <!-- ===== 左:預覽 ===== -->
    <div class="cl-left">
      <div class="cl-stage" id="clStage">
        <img class="cl-base" id="clBase" src="images/cloth-base.jpg?v=20260827"
             alt="樂活眼鏡布" draggable="false">
        <!-- 刻圖疊在布上。
             外框與節點放在 overlay 裡面 —— 這樣它們會跟著一起旋轉,
             節點永遠落在圖案真正的四個角上,而不是一個不會轉的方框。 -->
        <div class="cl-overlay" id="clOverlay" style="display:none">
          <span class="cl-node cl-node--nw" data-node="nw"></span>
          <span class="cl-node cl-node--ne" data-node="ne"></span>
          <span class="cl-node cl-node--sw" data-node="sw"></span>
          <span class="cl-node cl-node--se" data-node="se"></span>
          <span class="cl-rot-arm"></span>
          <span class="cl-node cl-node--rot" data-node="rot"
                title="拖曳可旋轉,按住 Shift 每 15 度一格">
            <i class="fa-solid fa-rotate-right"></i>
          </span>
        </div>
      </div>
      <p class="cl-hint">
        <i class="fa-solid fa-hand-pointer"></i>
        拖曳圖案移動 · 拉四個角縮放 · 上面那個把手可旋轉
      </p>
    </div>

    <!-- ===== 右:操作 ===== -->
    <div class="cl-right">

      <!-- 市集刻圖 -->
      <div class="cl-card" id="clMarketCard">
        <p class="cl-card-title">選一張刻圖</p>
        <div class="cl-search">
          <input type="text" id="clSearch" class="cl-input" placeholder="搜尋刻圖名稱、創作者…">
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <div class="cl-designs" id="clDesigns"></div>
        <button type="button" class="cl-more" id="clMore" style="display:none">展開全部</button>

      </div>

      <!-- 手繪 -->
      <div class="cl-card" id="clDrawCard" style="display:none">
        <p class="cl-card-title">自己畫一個</p>
        <!-- 白底黑線:轉成線稿的效果最好,也最接近實際印在布上的樣子 -->
        <canvas class="cl-canvas" id="clCanvas" width="1000" height="1000"></canvas>
        <div class="cl-draw-tools">
          <label class="cl-brush">
            筆畫粗細
            <input type="range" id="clBrush" min="6" max="48" value="18" step="1">
          </label>
          <div class="cl-draw-btns">
            <button type="button" class="cl-mini" id="clUndo">
              <i class="fa-solid fa-rotate-left"></i> 上一步
            </button>
            <button type="button" class="cl-mini" id="clClear">
              <i class="fa-regular fa-trash-can"></i> 全部清掉
            </button>
          </div>
        </div>
        <button type="button" class="cl-apply" id="clApply">把 這 張 放 上 去</button>
        <p class="cl-note-sm">
          線條會自動轉成印刷用的線稿,所以畫粗一點、筆畫清楚一點效果最好。
        </p>
      </div>

      <!-- 位置 -->
      <div class="cl-card" id="clPlaceCard">
        <p class="cl-card-title">放在哪裡</p>
        <label class="cl-range">
          <span>大小 <b id="clScaleVal">26%</b></span>
          <input type="range" id="clScale" min="6" max="60" value="26" step="1">
        </label>
        <label class="cl-range">
          <span>左右 <b id="clXVal">50</b></span>
          <input type="range" id="clX" min="0" max="100" value="50" step="1">
        </label>
        <label class="cl-range">
          <span>上下 <b id="clYVal">45</b></span>
          <input type="range" id="clY" min="0" max="100" value="45" step="1">
        </label>
        <button type="button" class="cl-reset" id="clReset">
          <i class="fa-solid fa-rotate-left"></i> 回到預設位置
        </button>
      </div>

      <!-- 取貨門市。
           -----------------------------------------------------------
           對客人:他要知道去哪裡拿。
           對我方:製作端(cloth-lab.html)靠這一欄把工作分成
                   「台中以北」與「台南以南」兩條線。

           ⚠ 不設必填。選不出來(門市 API 掛了、他還沒想好)不該
           擋住一件已經畫完的設計 —— 沒選的會落在製作端的「其他」,
           人工處理一下就好,那比讓他重畫一次划算得多。 -->
      <div class="cl-card" id="clStoreCard">
        <!-- ⚠ 標題用 .cl-card-title,與其他三張卡同一個 class。
             先前寫成 .cl-card-h —— 那個 class 不存在,所以整行沒有
             任何樣式,看起來就跟旁邊的卡片不是同一套東西。 -->
        <p class="cl-card-title">要到哪一家門市拿<span class="cl-req">*</span></p>
        <div class="cl-select-wrap">
          <select class="cl-input cl-select" id="clStore">
            <option value="">載入門市中…</option>
          </select>
          <i class="fa-solid fa-chevron-down cl-select-ico"></i>
        </div>
        <p class="cl-field-hint" id="clStoreHint">
          做好之後會送到這家門市,之後想換的話打個電話跟他們說一聲就好。
        </p>
        <button type="button" class="cl-retry" id="clStoreRetry" style="display:none">
          <i class="fa-solid fa-rotate-right"></i> 重新載入門市清單
        </button>
      </div>

      <div class="cl-note">
        <i class="fa-solid fa-circle-info"></i>
        此為示意畫面。實際印製的位置與顏色會在門市與你再次確認。
      </div>

      <div class="cl-err" id="clErr" style="display:none"></div>

      <!-- 本年度已完成。年度生日禮一年一件,存過就不能再存。
           ⚠ 放在存檔鈕【上方】—— 放下方的話,手機上他要捲過整顆按鈕
             才看得到為什麼按不下去,而那時候他已經在按了。 -->
      <div class="cl-lock" id="clLock" style="display:none">
        <i class="fa-solid fa-circle-check"></i>
        <span id="clLockText"></span>
      </div>

      <button type="button" class="cl-submit" id="clSubmit" disabled>儲 存 我 的 設 計</button>
      <p class="cl-submit-hint" id="clSubmitHint">請先選一張刻圖,或自己畫一個</p>

      <!-- 完成 -->
      <div class="cl-done" id="clDone" style="display:none">
        <i class="fa-solid fa-circle-check"></i>
        <p class="cl-done-title">已經幫你存起來了</p>
        <p class="cl-done-text" id="clDoneText"></p>
        <div class="cl-done-btns">
          <!-- ⚠ 是 allstore.html(門市清單)不是 store.html。
               store.html 是「單一門市」的內頁,沒帶門市代號進去就什麼都不顯示,
               點了看起來像沒反應 —— 2026-08-25 修正。 -->
          <a class="cl-done-btn primary" href="allstore.html">
            <i class="fa-solid fa-location-dot"></i> 到門市據點領取
          </a>
          <a class="cl-done-btn" href="member-portal.html?page=my-cloth">
            <i class="fa-regular fa-images"></i> 看我儲存的設計
          </a>
        </div>
      </div>

    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/utils.js"></script>
<script src="js/layout.js?v=20260819-erp"></script>
<script src="js/auth.js?v=20260817-appmember"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/potrace-loader.js?v=20260515-25"></script>

     完成時發 lohas:design-upload-success 事件。 -->
<script src="js/cropper-helper.js?v=20260513-2330"></script>
<script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.min.js"></script>
<script src="js/subcategories.js?v=20260513-2330"></script>
<script src="js/upload-design.js?v=20260825-noreview3"></script>
<!-- 門市清單(取貨門市下拉用)。api-core 要先於 api-store。 -->
<script src="js/api/api-core.js?v=20260517-1800"></script>
<script src="js/api/api-store.js?v=20260517-1800"></script>
<script src="js/store-data.js?v=20260814-kaoying"></script>
<script src="js/cloth.js?v=20260827-transform"></script>
</body>
</html>
