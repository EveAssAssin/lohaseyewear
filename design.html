  <title>客製文創 · LOHAS 樂活眼鏡</title>
  <meta name="description" content="為你選的眼鏡挑一張刻圖,決定刻在鏡片上的位置,完成後帶回商城結帳。">
  <!-- 帶商品參數的工作頁,不需要被收錄 -->
  <meta name="robots" content="noindex, nofollow">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/lohas-tokens.css">
  <link rel="stylesheet" href="css/lohas-base.css">
  <link rel="stylesheet" href="css/lohas-components.css">
  <link rel="stylesheet" href="css/design.css?v=20260809-1">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <script src="js/analytics.js?v=20260610-booking"></script>
</head>
<body class="dz">
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MSNPQ36L"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<div id="site-header"></div>

<main class="dz-main">

  <!-- 載入 / 錯誤 -->
  <div class="dz-state" id="dzLoading">
    <i class="fa-solid fa-pen-ruler dz-state-ico"></i>
    <p>載入商品中…</p>
  </div>

  <div class="dz-state" id="dzError" style="display:none">
    <i class="fa-regular fa-face-frown dz-state-ico"></i>
    <p id="dzErrorText"></p>
    <a class="dz-btn dz-btn--ghost" id="dzErrorBack" href="market.html">看看刻圖市集</a>
  </div>

  <!-- 主體 -->
  <div class="dz-wrap" id="dzBody" style="display:none">

    <div class="dz-head">
      <h1 class="dz-title">客製文創</h1>
      <p class="dz-sub">挑一張刻圖,決定刻在鏡片上的位置,完成後回到商城結帳。</p>
    </div>

    <!-- 左:預覽 -->
    <div class="dz-left">
      <div class="dz-stage" id="dzStage">
        <img class="dz-product-img" id="dzProductImg" alt="">
        <!-- 刻圖疊層,可拖曳 -->
        <img class="dz-overlay" id="dzOverlay" alt="" draggable="false" style="display:none">
      </div>
      <p class="dz-stage-hint" id="dzStageHint">
        <i class="fa-solid fa-hand-pointer"></i> 直接拖曳刻圖調整位置,或用右側滑桿微調
      </p>
    </div>

    <!-- 右:設定 -->
    <div class="dz-right">

      <!-- 商品 -->
      <section class="dz-card">
        <h2 class="dz-card-h">你選的眼鏡</h2>
        <div class="dz-product">
          <div class="dz-product-name" id="dzProductName">—</div>
          <div class="dz-product-price" id="dzProductPrice"></div>
        </div>
        <div class="dz-specs" id="dzSpecs"></div>
      </section>

      <!-- 刻圖 -->
      <section class="dz-card">
        <h2 class="dz-card-h">選一張刻圖</h2>
        <div class="dz-design-search">
          <input type="text" id="dzDesignSearch" placeholder="搜尋刻圖名稱、創作者…">
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <div class="dz-design-grid" id="dzDesignGrid">
          <p class="dz-empty">載入刻圖中…</p>
        </div>
      </section>

      <!-- 位置 -->
      <section class="dz-card" id="dzPlaceCard" style="display:none">
        <h2 class="dz-card-h">刻在哪裡</h2>

        <div class="dz-lens" id="dzLens">
          <button class="dz-lens-btn on" data-lens="right">右鏡片</button>
          <button class="dz-lens-btn" data-lens="left">左鏡片</button>
        </div>

        <div class="dz-row">
          <div class="dz-label">大小 <span id="dzScaleVal"></span></div>
          <input class="dz-slider" id="dzScale" type="range" min="0.04" max="0.30" step="0.005" value="0.12">
        </div>
        <div class="dz-row">
          <div class="dz-label">左右 <span id="dzXVal"></span></div>
          <input class="dz-slider" id="dzX" type="range" min="0" max="1" step="0.005" value="0.68">
        </div>
        <div class="dz-row">
          <div class="dz-label">上下 <span id="dzYVal"></span></div>
          <input class="dz-slider" id="dzY" type="range" min="0" max="1" step="0.005" value="0.38">
        </div>

        <button class="dz-reset" id="dzReset"><i class="fa-solid fa-rotate-left"></i> 回到預設位置</button>
      </section>

      <div class="dz-note">
        <i class="fa-solid fa-circle-info"></i>
        <span>此為示意畫面。實際雷刻位置會在門市與您再次確認,刻圖費用以商城結帳金額為準。</span>
      </div>

      <button class="dz-btn dz-btn--pri" id="dzSubmit" disabled>加 入 購 物 車</button>
      <p class="dz-submit-hint" id="dzSubmitHint">請先選一張刻圖</p>

    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/utils.js?v=20260513-2300"></script>
<script src="js/auth.js?v=20260808-session"></script>
<script src="js/supabase.js?v=20260513-2300"></script>
<script src="js/layout.js?v=20260513-2300"></script>
<script src="js/design.js?v=20260809-1"></script>
</body>
</html>
