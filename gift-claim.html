  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>領取禮物 · LOHAS 樂活眼鏡</title>
  <meta name="description" content="有人送了你一份樂活眼鏡的禮物,登入會員即可領取。">
  <!-- 領取連結不該被搜尋引擎收錄 -->
  <meta name="robots" content="noindex, nofollow">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/lohas-tokens.css">
  <link rel="stylesheet" href="css/lohas-base.css">
  <link rel="stylesheet" href="css/lohas-components.css">
  <link rel="stylesheet" href="css/gift-claim.css?v=20260827-portallink">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <script src="js/analytics.js?v=20260610-booking"></script>
</head>
<body class="gc">
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MSNPQ36L"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<div id="site-header"></div>

<main class="gc-main">

  <!-- 載入中 -->
  <div class="gc-state" id="gcLoading">
    <i class="fa-solid fa-gift gc-state-ico"></i>
    <p>正在打開禮物…</p>
  </div>

  <!-- 錯誤 / 不可領取 -->
  <div class="gc-state" id="gcError" style="display:none">
    <i class="fa-regular fa-face-frown gc-state-ico"></i>
    <p id="gcErrorText"></p>
    <a class="gc-btn gc-btn--ghost" href="index.html">回到首頁</a>
  </div>

  <!-- 禮物本體 -->
  <div class="gc-wrap" id="gcBody" style="display:none">

    <div class="gc-head">
      <p class="gc-eyebrow">A · G I F T · F O R · Y O U</p>
      <h1 class="gc-title" id="gcTitle">有人送了你一份禮物</h1>
      <p class="gc-from" id="gcFrom"></p>
    </div>

    <div class="gc-card">
      <div class="gc-visual" id="gcVisual"></div>
      <div class="gc-info">
        <div class="gc-item" id="gcItem"></div>
        <div class="gc-design" id="gcDesign"></div>
        <blockquote class="gc-msg" id="gcMsg" style="display:none"></blockquote>
      </div>
    </div>

    <!-- 尚未登入 -->
    <div class="gc-panel" id="gcNeedLogin" style="display:none">
      <!-- 2026-08-20 起官網註冊的會員也領得到(不需要門市客編),
           所以這裡可以放心邀請他註冊。 -->
      <!-- ⚠ 兩顆鈕都要在。
           -----------------------------------------------------------
           收到這個連結的人【很可能根本不是會員】—— 那正是這條路線
           存在的理由。原本只給「登入領取」,他得先點進登入頁,
           才在角落找到一行「還不是會員?立即註冊」。

           在這一頁多繞一步就會流失一個人,而流失的是一份
           已經付過錢的禮物。 -->
      <p class="gc-panel-text">
        登入樂活會員即可領取這份禮物。<br>
        還不是會員也沒關係 —— 註冊完成後會自動回到這一頁,直接領。
      </p>
      <button class="gc-btn gc-btn--pri" id="gcLoginBtn">登 入 領 取</button>
      <button class="gc-btn gc-btn--ghost" id="gcRegBtn" style="margin-top:10px">還 不 是 會 員 · 免 費 註 冊</button>
    </div>

    <!-- 2026-08-19 這裡曾有一個「這份禮物先幫你留著」的面板,
         擋住未綁定門市的會員不讓他領。2026-08-20 移除 ——
         那把 B 路線做反了:B 路線的用意就是讓還不是會員的人也收得到
         禮物,再把他帶進門市綁定。擋在領取這一關,他就沒有理由去店裡。
         現在兩條路線都領得到,差別寫在領取完成的說明裡。 -->

    <!-- 確認領取 -->
    <form class="gc-panel" id="gcForm" style="display:none">
      <h2 class="gc-panel-h">確認領取</h2>
      <!-- 收禮人稱呼:連結被轉傳時,至少讓不相干的人先猶豫一下 -->
      <p class="gc-panel-text gc-forwho" id="gcForWho" style="display:none"></p>
      <p class="gc-panel-text" id="gcClaimNote"></p>

      <p class="gc-form-err" id="gcFormErr" style="display:none"></p>
      <button class="gc-btn gc-btn--pri" id="gcSubmit" type="submit">確 認 領 取</button>
    </form>

    <!-- 已領取 -->
    <div class="gc-panel gc-panel--done" id="gcDone" style="display:none">
      <i class="fa-solid fa-circle-check gc-done-ico"></i>
      <h2 class="gc-panel-h">已完成領取</h2>
      <p class="gc-panel-text" id="gcDoneText"></p>
      <!-- 主要按鈕的去處依狀態而定(見 js 的 applyDoneBtn):
           未綁定 → 看門市據點;可挑款式 → 挑選款式;其餘 → 禮物中心。 -->
      <a class="gc-btn" id="gcDoneBtn" href="member-portal.html?page=gifts">到禮物中心查看</a>
      <!-- 第二條路:什麼都不用做,直接到門市讓店員陪他挑。
           預設藏著,只有 B 路線(還沒挑款式)才由 js 打開。 -->
      <a class="gc-btn gc-btn--ghost" id="gcStoreBtn" style="display:none;margin-top:10px">
        <i class="fa-solid fa-location-dot"></i> 到 門 市 挑 選
      </a>
      <!-- ⚠ 這一條永遠都在。
           主要按鈕會被 applyDoneBtn 改寫成「看門市據點」或「挑選款式」,
           改寫之後就沒有任何回到禮物中心的路了 —— 而那是他之後
           要查狀態、找兌換券的唯一地方。 -->
      <a class="gc-done-link" id="gcPortalLink" href="member-portal.html?page=gifts">
        <i class="fa-solid fa-arrow-right-long"></i> 前往會員中心查看這份禮物
      </a>
    </div>

  </div>
</main>

<div id="site-footer"></div>

<script src="js/utils.js?v=20260513-2300"></script>
<script src="js/auth.js?v=20260817-appmember"></script>

<script src="js/gift-claim.js?v=20260828-app"></script>
</body>
</html>
