<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google" content="notranslate">
<title>會員登入中...</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="css/lohas-tokens.css">
<style>
  body{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg-warm);
    font-family:var(--font-tc);
    color:var(--text-main);
  }
  .sso-box{
    text-align:center;
    padding:48px 32px;
    max-width:420px;
  }
  .sso-mark{width:72px;height:72px;margin:0 auto 32px;position:relative}
  .sso-mark .ring{position:absolute;inset:0;border:1px solid var(--lohas-bd);border-radius:50%}
  .sso-mark .arc{
    position:absolute;inset:0;
    border:1.5px solid transparent;
    border-top-color:var(--lohas-light);
    border-right-color:var(--lohas-light);
    border-radius:50%;
    animation:ssoSpin 1.4s cubic-bezier(.5,0,.5,1) infinite;
  }
  .sso-mark .dot{
    position:absolute;top:50%;left:50%;
    width:6px;height:6px;
    background:var(--lohas-light);
    border-radius:50%;
    transform:translate(-50%,-50%);
    animation:ssoPulse 1.4s ease-in-out infinite;
  }
  @keyframes ssoSpin{to{transform:rotate(360deg)}}
  @keyframes ssoPulse{
    0%,100%{opacity:.3;transform:translate(-50%,-50%) scale(.85)}
    50%{opacity:.75;transform:translate(-50%,-50%) scale(1.15)}
  }
  .sso-title{
    font-size:17px;letter-spacing:8px;
    color:var(--lohas-hover);
    font-weight:500;padding-left:8px;margin-bottom:18px;
  }
  .sso-divider{width:28px;height:1px;background:var(--lohas-bd);margin:0 auto 18px}
  .sso-msg{
    font-size:12px;letter-spacing:3px;
    color:var(--text-muted);
    line-height:1.8;font-weight:400;padding-left:3px;
  }
  .sso-msg.is-err{color:var(--err);letter-spacing:2px}
  .sso-btn{
    display:inline-block;margin-top:28px;
    padding:11px 32px;
    border:1px solid var(--lohas-brand);
    color:var(--lohas-brand);background:transparent;
    text-decoration:none;
    font-size:12px;letter-spacing:4px;font-weight:500;
    border-radius:var(--r-pill);
    transition:all .25s ease;padding-left:36px;
  }
  .sso-btn:hover{background:var(--lohas-brand);color:#fff}
</style>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">

</head>
<body>
  <div class="sso-box" id="ssoBox">
    <div class="sso-mark" id="ssoMark">
      <div class="ring"></div>
      <div class="arc"></div>
      <div class="dot"></div>
    </div>
    <div class="sso-title">會 員 登 入 中</div>
    <div class="sso-divider"></div>
    <div class="sso-msg" id="ssoMsg">驗 證 身 份 中 , 請 稍 候</div>
  </div>

<script>
(async () => {
  // SSO 驗證 + 會員資料 + session token 一次由 auth-session 於伺服器端完成,
  // 前端不再持有 proxy 金鑰。
  const AUTH_SESSION_URL  = 'https://hqdmyxxrskvllkcedybl.supabase.co/functions/v1/auth-session';
  const DEFAULT_NEXT      = '/market.html';

  const url   = new URL(location.href);
  const token = url.searchParams.get('token');
  const next  = url.searchParams.get('next') || DEFAULT_NEXT;

  const box  = document.getElementById('ssoBox');
  const mark = document.getElementById('ssoMark');
  const msg  = document.getElementById('ssoMsg');

  function fail(text, withButton){
    mark.style.display = 'none';
    msg.classList.add('is-err');
    msg.textContent = text;
    if (withButton){
      const btn = document.createElement('a');
      btn.href = '/login.html';
      btn.className = 'sso-btn';
      btn.textContent = '前 往 登 入';
      box.appendChild(btn);
    }
  }

  if (!token) return fail('缺少 SSO token,請從 App 重新進入', true);

  try {
    // ===== Step 1: 由伺服器端一次完成 SSO 驗證 + 取會員資料 + 簽發 session token =====
    // 一次性 SSO token 在 auth-session 內部驗證(會被消耗),
    // 前端不再接觸 proxy 金鑰。
    const authRes  = await fetch(AUTH_SESSION_URL, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ action: 'sso', ssoToken: token }),
    });
    const authJson = await authRes.json();

    if (String(authJson.code) !== '200' || !authJson.token){
      return fail(authJson.message || '驗證失敗,請重新登入', true);
    }

    const profile = authJson.member || {};
    const member  = {
      erpid:    profile.client_id || '',
      name:     profile.name      || '',
      mobile:   profile.mobile    || '',
      email:    profile.email     || '',
      birthday: profile.birthday  || '',
    };

    // ===== Step 2: 寫入 localStorage (對齊 auth.js STORAGE_KEY = 'lohasMember') =====
    localStorage.setItem('lohasMember', JSON.stringify(member));
    localStorage.setItem('lohasSessionToken', authJson.token);  // 供票券等需驗身分的功能使用
    localStorage.setItem('lohasLoginAt', String(Date.now()));   // P1 過期機制

    msg.textContent = '登 入 成 功 , 即 將 跳 轉';

    /* safe redirect:只允許同站。
       ⚠ 2026-08-25 修正:原本用字串比對(開頭是 / 且不是 //),
         被 `/\evil.com` 繞過 —— 瀏覽器把反斜線正規化成斜線,
         於是它變成 //evil.com,也就是 https://evil.com/。
         改成交給 URL 解析器判斷:它已經知道那些正規化規則。
         這一層與 store-sso-login 那層是同一套判斷,兩層都要有 ——
         發 token 的當下擋掉是主要防線,這裡是最後一道。 */
    let target = DEFAULT_NEXT;
    try {
      const u = new URL(next, location.origin);
      if (u.origin === location.origin) target = u.pathname + u.search + u.hash;
    } catch (_) { /* 解析不了就用預設 */ }
    setTimeout(() => { location.replace(target); }, 600);

  } catch (e) {
    console.error('[SSO]', e);
    fail('網路錯誤,請稍後再試', true);
  }
})();
</script>
</body>
</html>
