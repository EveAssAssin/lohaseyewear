  <title>LOHAS 樂活眼鏡 - 會員登入</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- LOHAS CSS · 載入順序: tokens → base → components → page -->
  <link rel="stylesheet" href="css/lohas-tokens.css">
  <link rel="stylesheet" href="css/lohas-base.css">
  <link rel="stylesheet" href="css/lohas-components.css">

  <div id="site-header"></div>

  <main id="login-section" class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm">
      <div class="text-center mb-8">
        <p class="text-[#50422D] text-2xl tracking-[0.12em] font-medium">
          會員登入
        </p>
      </div>

      <div class="space-y-5">
        <input type="text" id="account" class="input-lohas" placeholder="APP 帳號" autocomplete="username">
        <input type="password" id="password" class="input-lohas" placeholder="密碼" autocomplete="current-password">

        <div id="error-msg" class="text-red-500 text-sm hidden text-center"></div>

        <button id="login-btn" class="btn-lohas" type="button">
          登入
        </button>
      </div>

      <!-- 與登入按鈕拉開距離:註冊是「另一條路」,不是登入流程的下一步。
           貼太近會讓人以為要先按它。

           2026-08-19 開放。在此之前這裡是一句「請至門市或 App 註冊」的純文字 ——
           member-auth 當時指向測試站,註冊成功的帳號會建在測試環境然後登不進來。
           要再次關閉的話,這段與 js/register.js 的 NOT_READY 必須一起改,
           只改一邊會變成「連結點得到、進去說尚未開放」。 -->
      <p class="text-center text-[13px] text-[#9B9186] mt-10">
        還不是會員?<a href="register.html"
          class="text-[#50422D] border-b border-current no-underline ml-1.5">立即註冊</a>
      </p>
    </div>
  </main>

  <script src="js/layout.js?v=20261012-noapptrack"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js?v=20260817-appmember"></script>
  <script src="js/login.js?v=20260817-appmember"></script>
