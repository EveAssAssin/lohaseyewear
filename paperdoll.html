<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
<!-- Google Tag Manager -->

new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],

  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>從零開始，打造那副只有我才有的眼鏡 — 樂活眼鏡</title>
  <meta name="description" content="從臉型挑鏡框、從刻圖市集選一個故事，再從台灣各地職人的作品裡，找到屬於你的配件。">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- LOHAS CSS · tokens → base → components → page -->
  <link rel="stylesheet" href="css/lohas-tokens.css">
  <link rel="stylesheet" href="css/lohas-base.css">
  <link rel="stylesheet" href="css/lohas-components.css">
  <link rel="stylesheet" href="css/paperdoll.css?v=20260731e">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <script src="js/analytics.js?v=20260610-booking"></script>
  <script src="js/layout.js?v=20260516" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js?v=20260518" defer></script>
  <!-- 鏡框百科資料（Step 1 連動） -->
  <script src="js/frames-data.js?v=20260731e" defer></script>
  <!-- 客製流程 -->
  <script src="js/paperdoll-data.js?v=20260731e" defer></script>
  <script src="js/paperdoll.js?v=20260731e" defer></script>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MSNPQ36L"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<div id="site-header"></div>

<main>
<div id="pd-app">

  <!-- ── 步驟列 ── -->
  <div class="pd-stepbar">
    <div class="pd-step active" onclick="PD.goStep(1)">
      <div class="pd-step-dot">1</div><div class="pd-step-label">選鏡框</div>
    </div>
    <div class="pd-step-arrow"></div>
    <div class="pd-step" onclick="PD.goStep(2)">
      <div class="pd-step-dot">2</div><div class="pd-step-label">選刻圖</div>
    </div>
    <div class="pd-step-arrow"></div>
    <div class="pd-step" onclick="PD.goStep(3)">
      <div class="pd-step-dot">3</div><div class="pd-step-label">選配件</div>
    </div>
    <div class="pd-step-arrow"></div>
    <div class="pd-step" onclick="PD.goStep(4)">
      <div class="pd-step-dot">4</div><div class="pd-step-label">命名</div>
    </div>
    <div class="pd-step-arrow"></div>
    <div class="pd-step" onclick="PD.goStep(5)">
      <div class="pd-step-dot">5</div><div class="pd-step-label">收藏</div>
    </div>
  </div>

  <!-- ── FOUND 護照（第一次發現後才出現） ── -->
  <div class="pd-passport" id="passport">
    <div>
      <div class="pp-label">LOHAS FOUND</div>
      <div class="pp-count" id="pp-count"></div>
    </div>
    <div class="pp-stamps" id="pp-stamps"></div>
  </div>

  <!-- ══════════════════════════════════════
       STEP 1 — 臉型 → 鏡框
  ══════════════════════════════════════ -->
  <div class="pd-screen" data-step="1">
    <div class="pd-panel">
      <div class="pd-panel-hd">
        <div class="pd-eyebrow">STEP 1</div>
        <div class="pd-panel-title">先看看你的臉</div>
        <div class="pd-panel-sub">選一個最接近的臉型，我們從鏡框百科幫你篩出合適的款式</div>
      </div>
      <div class="pd-panel-body">

        <div class="pd-face-grid" id="face-grid"></div>

        <div class="pd-frame-result" id="frame-result" style="display:none">
          <div class="pd-frame-count" id="frame-count"></div>
          <div class="pd-filter-row" id="frame-groups"></div>
          <div class="pd-frame-grid" id="frame-grid"></div>

          <div class="pd-frame-bar" id="frame-bar">
            <div>
              <div class="fb-lbl">已選鏡框</div>
              <div class="fb-name" id="fb-name"></div>
            </div>
            <div class="fb-price" id="fb-price"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════
       STEP 2 — 刻圖
  ══════════════════════════════════════ -->
  <div class="pd-screen" data-step="2" style="display:none">
    <div class="pd-panel">
      <div class="pd-panel-hd">
        <div class="pd-eyebrow">STEP 2</div>
        <div class="pd-panel-title">刻一個故事上去</div>
        <div class="pd-panel-sub">與刻圖市集同步，每一個圖案背後都有一位真實的創作者</div>
      </div>
      <div class="pd-panel-body">
        <div class="pd-eng-layout">
          <div>
            <div class="pd-filter-row" id="eng-filters"></div>
            <div class="pd-eng-search">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="text" id="eng-search" placeholder="搜尋刻圖名稱、設計師或關鍵字">
            </div>
            <div class="pd-eng-grid" id="eng-grid"></div>
            <div class="pd-eng-more" id="eng-more"></div>
            <div style="margin-top:16px;font-size:12px;color:var(--text-muted);text-align:center">
              不刻圖也可以
              <span style="color:var(--warn);cursor:pointer;text-decoration:underline;margin-left:4px"
                    onclick="PD.skipEng()">直接跳過 →</span>
            </div>
          </div>
          <div class="pd-eng-story" id="eng-story"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════
       STEP 3 — 配件
       表面就是一般購物頁，FOUND 藏在壓印章裡
  ══════════════════════════════════════ -->
  <div class="pd-screen" data-step="3" style="display:none">
    <div class="pd-panel">
      <div class="pd-panel-hd">
        <div class="pd-eyebrow">STEP 3</div>
        <div class="pd-panel-title">挑幾件配件</div>
        <div class="pd-panel-sub">收納盒、眼鏡布、展示架，讓你的眼鏡有個好歸宿</div>
      </div>
      <div class="pd-panel-body">
        <div class="pd-tabs" id="type-tabs"></div>
        <div class="pd-shop-grid" id="shop-grid"></div>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════
       STEP 4 — 命名
  ══════════════════════════════════════ -->
  <div class="pd-screen" data-step="4" style="display:none">
    <div class="pd-panel">
      <div class="pd-panel-hd">
        <div class="pd-eyebrow">STEP 4</div>
        <div class="pd-panel-title">給它一個名字</div>
        <div class="pd-panel-sub">有名字的東西，是不一樣的</div>
      </div>
      <div class="pd-panel-body">
        <div class="pd-naming-wrap">
          <div class="pd-naming-q">這副眼鏡，叫什麼？</div>
          <div class="pd-naming-sub">可以是地名、一首歌、一個人的名字，或只有你懂的兩個字</div>
          <input class="pd-naming-input" id="naming-input" maxlength="20" placeholder="雨天散步">
          <div class="pd-naming-hints">
            <button class="pd-naming-hint" onclick="PD.applyHint('雨天散步')">雨天散步</button>
            <button class="pd-naming-hint" onclick="PD.applyHint('外婆的菜園')">外婆的菜園</button>
            <button class="pd-naming-hint" onclick="PD.applyHint('三十歲')">三十歲</button>
            <button class="pd-naming-hint" onclick="PD.applyHint('安靜的下午')">安靜的下午</button>
            <button class="pd-naming-hint" onclick="PD.applyHint('第一次去京都')">第一次去京都</button>
          </div>
          <div class="pd-naming-preview">
            <div class="np-name" id="np-name">（還沒有名字）</div>
            <div class="np-detail" id="np-detail"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════
       STEP 5 — 收藏
  ══════════════════════════════════════ -->
  <div class="pd-screen" data-step="5" style="display:none">
    <div class="pd-panel">
      <div class="pd-panel-hd">
        <div class="pd-eyebrow">STEP 5</div>
        <div class="pd-panel-title">你的作品</div>
        <div class="pd-panel-sub">做完了，它屬於你了</div>
      </div>
      <div class="pd-panel-body">
        <div class="pd-final">

          <!-- 左：Flat Lay 套餐卡 -->
          <div class="pd-outfit-card">
            <div class="pd-oc-eb">LOHAS EYEWEAR · 我的套餐</div>
            <div class="pd-oc-name" id="oc-name">未命名套餐</div>
            <div class="pd-oc-sub"  id="oc-sub"></div>
            <div class="pd-oc-by"   id="oc-by"></div>

            <div class="pd-flatlay" id="flatlay"></div>
            <div class="pd-fl-more" id="fl-more"></div>

            <div class="pd-oc-total" id="oc-total"></div>
          </div>

          <!-- 右：明細 + 護照 + 動作 -->
          <div class="pd-final-side">
            <div class="pd-oc-list" id="oc-list"></div>
            <div class="pd-oc-passport" id="oc-passport"></div>

            <div class="pd-final-actions">
              <button class="pd-cart-btn">
                <i class="fa-solid fa-bag-shopping"></i> 加入購物車
              </button>
              <button class="btn-pill-outline" onclick="PD.saveOutfit()">
                <i class="fa-regular fa-bookmark"></i> 收藏此套餐
              </button>
              <button class="btn-pill-ghost" onclick="PD.shareCard()">
                <i class="fa-solid fa-share-nodes"></i> 分享
              </button>
              <button class="btn-pill-ghost" onclick="PD.goStep(3)">
                <i class="fa-solid fa-rotate-left"></i> 回去調整
              </button>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

</div><!-- /#pd-app -->
</main>


<!-- ── 浮動操作列 ── -->
<div class="pd-actionbar" id="actionbar">
  <button class="ab-back" id="ab-back" onclick="PD.prevStep()" aria-label="上一步">
    <i class="fa-solid fa-arrow-left"></i>
  </button>

  <div class="ab-info">
    <div class="ab-line" id="ab-line"></div>
    <div class="ab-sub"  id="ab-sub"></div>
  </div>

  <div class="ab-total" id="ab-total"></div>

  <button class="ab-skip" id="ab-skip" onclick="PD.nextStep()">先跳過</button>
  <button class="ab-next" id="ab-next" onclick="PD.nextStep()">
    <span id="ab-next-t">下一步</span> <i class="fa-solid fa-arrow-right"></i>
  </button>
</div>

<!-- ── 全螢幕故事層 ── -->
<div class="pd-story-layer" id="story-layer"></div>

<!-- ── 發現提示 ── -->
<div class="pp-toast" id="pp-toast"></div>

<div id="site-footer"></div>

</body>
</html>
