<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 工作用頁面,不要被搜尋引擎收錄 -->
  <meta name="robots" content="noindex, nofollow">
  <title>客製眼鏡布加工中心 · LOHAS 樂活眼鏡</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- LOHAS CSS · 載入順序: tokens → base → page -->
  <link rel="stylesheet" href="css/lohas-tokens.css">
  <link rel="stylesheet" href="css/lohas-base.css">
  <link rel="stylesheet" href="css/cloth-lab.css?v=20260911-dash">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
</head>

<body class="lab">

  <header class="lab-top">
    <!-- 深色底換成淺色底,LOGO 用官網同一支 SVG。
         那支 SVG 本身是深色(#47422C),放在淺底上不必改色。 -->
    <img class="lab-logo" src="images/lohas-logo.svg" alt="LOHAS 樂活眼鏡">
    <span class="lab-title">客製眼鏡布加工中心</span>
    <button type="button" class="lab-out" id="labOut" hidden title="換一台裝置或不再使用時按這裡">
      <i class="fa-solid fa-arrow-right-from-bracket"></i>
    </button>
  </header>

  <main class="lab-main">

    <!-- 通行碼 -->
    <section class="lab-gate" id="labGate">
      <i class="fa-solid fa-lock lab-gate-ico"></i>
      <p class="lab-gate-title">請輸入通行碼</p>
      <p class="lab-gate-sub">輸入一次就好,這台裝置會記住。</p>
      <input type="password" id="labCode" class="lab-input" placeholder="通行碼"
             autocomplete="off" inputmode="text">
      <div class="lab-msg is-err" id="labGateErr" hidden></div>
      <button type="button" class="lab-btn" id="labEnter">進 入</button>
    </section>

    <!-- 列表 -->
    <section class="lab-body" id="labBody" hidden>
      <!-- ===== 檢視切換 =====
           製作端平常只用「工作清單」,儀表板是主管／排產的人在看的。
           所以放在最上面一排、預設停在工作清單 ——
           站在機台旁邊的人不該多按一次才看到今天要做什麼。 -->
      <div class="lab-views" id="labViews">
        <button type="button" class="lab-view-btn on" data-v="list">工作清單</button>
        <button type="button" class="lab-view-btn" data-v="dash">儀表板</button>
      </div>

      <!-- ⚠ 兩組分頁一定要分行、而且各自有名字。
           -----------------------------------------------------------
           先前兩組併在同一排,結果是六顆藥丸連成一條、其中兩顆
           都寫著「全部」、兩顆都是深色 —— 看起來像同一組裡選了兩個,
           而且分不出哪個「全部」管哪件事。

           所以:分兩行、左邊標名字、第二組的「全部」改叫「全區」。
           同一個詞在兩個地方各指一件事,是最省字也最容易誤讀的寫法。 -->
      <div class="lab-bar">
        <div class="lab-filter">
          <span class="lab-filter-label">狀態</span>
          <div class="lab-seg" id="labStatus">
            <button type="button" class="lab-seg-btn on" data-s="new">待製作</button>
            <button type="button" class="lab-seg-btn" data-s="done">已完成</button>
            <!-- 已退件：師傅退回、等客人重新設計的。
                 給它一個分頁是因為那些件會從「待製作」消失 ——
                 沒有這一格的話，退完就等於從畫面上蒸發，
                 沒有人知道有幾件卡在等客人。 -->
            <button type="button" class="lab-seg-btn" data-s="rejected">已退件</button>
            <button type="button" class="lab-seg-btn" data-s="">全部</button>
          </div>
        </div>

        <!-- 產線分流。依客人選的取貨門市所在區域切。
             ⚠「其他」那一格平時是藏著的,只有真的有東西落在那裡
             才會出現 —— 那些是沒選門市、或海外門市的件。
             不給它一個位置的話,那些件會從兩個分頁裡同時消失,
             而沒有人會發現。 -->
        <div class="lab-filter">
          <span class="lab-filter-label">產線</span>
          <div class="lab-seg" id="labArea">
            <button type="button" class="lab-seg-btn on" data-a="">全區<em data-n></em></button>
            <button type="button" class="lab-seg-btn" data-a="north">台中以北<em data-n></em></button>
            <button type="button" class="lab-seg-btn" data-a="south">台南以南<em data-n></em></button>
            <button type="button" class="lab-seg-btn" data-a="other" hidden>其他<em data-n></em></button>
          </div>
        </div>
      </div>

      <div class="lab-msg" id="labMsg" hidden></div>
      <div id="labList"></div>

      <!-- ===== 儀表板 =====
           ⚠ 它跟工作清單看的是【不同範圍】的資料:
             工作清單只抓當前狀態的前 100 筆(師傅要的是「現在要做什麼」),
             儀表板要全部(算比例、算耗時都不能只看一部分)。
           所以兩邊各自抓,不共用 State.items —— 共用的話數字會
           隨著上面那兩排篩選跳動,而看的人不會知道自己在看子集。 -->
      <div class="lab-dash" id="labDash" hidden>
        <div class="lab-dash-bar">
          <div class="lab-filter">
            <span class="lab-filter-label">期間</span>
            <div class="lab-seg" id="dashRange">
              <button type="button" class="lab-seg-btn" data-r="30">近 30 天</button>
              <button type="button" class="lab-seg-btn" data-r="90">近 90 天</button>
              <button type="button" class="lab-seg-btn" data-r="365">近一年</button>
              <button type="button" class="lab-seg-btn on" data-r="">全部</button>
            </div>
          </div>
          <div class="lab-dash-actions">
            <button type="button" class="lab-btn lab-btn-ghost" id="dashReload">重新整理</button>
            <button type="button" class="lab-btn" id="dashCsv">匯出 CSV</button>
          </div>
        </div>

        <div class="lab-dash-note" id="dashNote"></div>

        <div class="lab-kpis" id="dashKpis"></div>

        <div class="lab-tables" id="dashTables"></div>
      </div>
    </section>

  </main>

  <!-- ===== EZCAD模擬器 =====
       畫的是【DXF 檔案裡的幾何】,不是原始圖檔。
       EZCAD 的「填充」是用固定間距的平行線在封閉輪廓內來回掃,
       所以這裡也畫掃描線而不是實心色塊 —— 師傅要判斷的正是
       「這個線間距蓋不蓋得到細節」,實心圖看不出那件事。 -->
  <div class="sim-back" id="simBack" hidden>
    <div class="sim-box" role="dialog" aria-modal="true" aria-labelledby="simTitle">
      <div class="sim-head">
        <b id="simTitle">EZCAD模擬器</b>
        <button type="button" class="sim-x" id="simX" aria-label="關閉">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="sim-ctl">
        <label>線間距
          <select id="simGap">
            <option value="0.03">0.03 mm</option>
            <option value="0.05" selected>0.05 mm</option>
            <option value="0.08">0.08 mm</option>
            <option value="0.12">0.12 mm</option>
            <option value="0.2">0.20 mm</option>
            <option value="0.4">0.40 mm</option>
          </select>
        </label>
        <label>角度
          <select id="simAng">
            <option value="0">0°</option>
            <option value="45" selected>45°</option>
            <option value="90">90°</option>
          </select>
        </label>
        <label class="sim-chk">
          <input type="checkbox" id="simEdge" checked> 顯示輪廓線
        </label>
        <span class="sim-info" id="simInfo"></span>
      </div>
      <div class="sim-stage" id="simStage"></div>
      <p class="sim-note">
        掃描線是照 EZCAD 的做法畫的（平行線 + 奇偶規則挖洞）。
        線間距調大時如果細節開始斷掉，實際刻出來也會斷。
      </p>
    </div>
  </div>

  <!-- 製作單上的 QR。
       ⚠ 刻意載在這一頁而不是列印視窗裡：載不到的話，printSlip() 會在
         按下去的當下就講清楚，而不是印出一張沒有 QR 的單子 ——
         那種單子看起來完全正常，到了門市才發現掃不了，而布已經寄出去了。 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <div id="labQrTmp" style="display:none"></div>

  <script src="js/dxf.js?v=20260903-rings"></script>
  <script src="js/cloth-lab.js?v=20260911-dash2"></script>
</body>
</html>
