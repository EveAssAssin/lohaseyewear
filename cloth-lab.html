<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 工作用頁面,不要被搜尋引擎收錄 -->
  <meta name="robots" content="noindex, nofollow">
  <title>客製眼鏡布加工中心 · LOHAS 樂活眼鏡</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- LOHAS CSS · 載入順序: tokens → base → page -->
  <link rel="stylesheet" href="css/lohas-tokens.css">
  <link rel="stylesheet" href="css/lohas-base.css">
  <link rel="stylesheet" href="css/cloth-lab.css?v=20260827-tabs">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
</head>

<body class="lab">

  <header class="lab-top">
    <!-- 深色底換成淺色底,LOGO 用官網同一支 SVG。
         那支 SVG 本身是深色(#47422C),放在淺底上不必改色。 -->
    <img class="lab-logo" src="images/lohas-logo.svg" alt="LOHAS 樂活眼鏡">
    <span class="lab-title">客製眼鏡布加工中心</span>
    <button type="button" class="lab-out" id="labOut" hidden title="換一台裝置或不再使用時按這裡">
      <i class="fa-solid fa-arrow-right-from-bracket"></i>
    </button>
  </header>

  <main class="lab-main">

    <!-- 通行碼 -->
    <section class="lab-gate" id="labGate">
      <i class="fa-solid fa-lock lab-gate-ico"></i>
      <p class="lab-gate-title">請輸入通行碼</p>
      <p class="lab-gate-sub">輸入一次就好,這台裝置會記住。</p>
      <input type="password" id="labCode" class="lab-input" placeholder="通行碼"
             autocomplete="off" inputmode="text">
      <div class="lab-msg is-err" id="labGateErr" hidden></div>
      <button type="button" class="lab-btn" id="labEnter">進 入</button>
    </section>

    <!-- 列表 -->
    <section class="lab-body" id="labBody" hidden>
      <!-- ⚠ 兩組分頁一定要分行、而且各自有名字。
           -----------------------------------------------------------
           先前兩組併在同一排,結果是六顆藥丸連成一條、其中兩顆
           都寫著「全部」、兩顆都是深色 —— 看起來像同一組裡選了兩個,
           而且分不出哪個「全部」管哪件事。

           所以:分兩行、左邊標名字、第二組的「全部」改叫「全區」。
           同一個詞在兩個地方各指一件事,是最省字也最容易誤讀的寫法。 -->
      <div class="lab-bar">
        <div class="lab-filter">
          <span class="lab-filter-label">狀態</span>
          <div class="lab-seg" id="labStatus">
            <button type="button" class="lab-seg-btn on" data-s="new">待製作</button>
            <button type="button" class="lab-seg-btn" data-s="done">已完成</button>
            <!-- 已退件：師傅退回、等客人重新設計的。
                 給它一個分頁是因為那些件會從「待製作」消失 ——
                 沒有這一格的話，退完就等於從畫面上蒸發，
                 沒有人知道有幾件卡在等客人。 -->
            <button type="button" class="lab-seg-btn" data-s="rejected">已退件</button>
            <button type="button" class="lab-seg-btn" data-s="">全部</button>
          </div>
        </div>

        <!-- 產線分流。依客人選的取貨門市所在區域切。
             ⚠「其他」那一格平時是藏著的,只有真的有東西落在那裡
             才會出現 —— 那些是沒選門市、或海外門市的件。
             不給它一個位置的話,那些件會從兩個分頁裡同時消失,
             而沒有人會發現。 -->
        <div class="lab-filter">
          <span class="lab-filter-label">產線</span>
          <div class="lab-seg" id="labArea">
            <button type="button" class="lab-seg-btn on" data-a="">全區<em data-n></em></button>
            <button type="button" class="lab-seg-btn" data-a="north">台中以北<em data-n></em></button>
            <button type="button" class="lab-seg-btn" data-a="south">台南以南<em data-n></em></button>
            <button type="button" class="lab-seg-btn" data-a="other" hidden>其他<em data-n></em></button>
          </div>
        </div>
      </div>

      <div class="lab-msg" id="labMsg" hidden></div>
      <div id="labList"></div>
    </section>

  </main>

  <script src="js/dxf.js?v=20260827-rot"></script>
  <script src="js/cloth-lab.js?v=20260902-reject"></script>
</body>
</html>
