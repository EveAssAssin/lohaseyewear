  <meta name="google" content="notranslate">

  <title>刻圖模擬 · LOHAS 樂活眼鏡</title>
  <meta name="description" content="用相機或上傳照片,即時預覽刻圖雷刻在你眼鏡鏡片上的樣子。">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/lohas-tokens.css">
  <link rel="stylesheet" href="css/lohas-base.css">
  <link rel="stylesheet" href="css/lohas-components.css">
  <link rel="stylesheet" href="css/engrave-preview.css?v=20260809-b2">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <script src="js/analytics.js?v=20260610-booking"></script>
</head>
<body class="ep">
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MSNPQ36L"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<div id="site-header"></div>

<main class="ep-main">

  <div class="ep-head">
    <a class="ep-back" href="market.html"><i class="fa-solid fa-chevron-left"></i> 回刻圖市集</a>
    <h1 class="ep-title">刻圖模擬</h1>
    <p class="ep-sub">看看這張刻圖雷刻在你眼鏡上的樣子</p>
  </div>

  <div class="ep-wrap">

    <!-- ===== 左:預覽 ===== -->
    <div class="ep-left">
      <div class="ep-stage" id="epStage">
        <video id="epVideo" playsinline muted autoplay></video>
        <canvas id="epCanvas"></canvas>

        <div class="ep-hint" id="epHint">
          <div id="epHintCamera">
            <i class="fa-solid fa-camera ep-hint-ico"></i>
            <p>戴上你的眼鏡,按下方「開始模擬」</p>
            <small>影像只在你的裝置處理,不會上傳</small>
          </div>
          <div id="epHintPhoto" style="display:none">
            <i class="fa-regular fa-image ep-hint-ico"></i>
            <p>上傳一張戴眼鏡的正面照</p>
            <small>照片只在你的裝置處理,不會上傳</small>
          </div>
        </div>

        <div class="ep-status" id="epStatus"></div>
      </div>

      <div class="ep-modes">
        <button class="ep-mode on" id="epTabCamera"><i class="fa-solid fa-camera"></i> 即時相機</button>
        <button class="ep-mode" id="epTabPhoto"><i class="fa-regular fa-image"></i> 上傳照片</button>
      </div>

      <button class="ep-btn ep-btn--main" id="epStartBtn">開 始 模 擬</button>
      <button class="ep-btn ep-btn--main" id="epPhotoBtn" style="display:none">選 擇 照 片</button>
      <input type="file" id="epFileInput" accept="image/*" hidden>
      <button class="ep-btn ep-btn--ghost" id="epStopBtn" style="display:none">停 止 / 重 選</button>
    </div>

    <!-- ===== 右:刻圖資訊 + 調整 ===== -->
    <div class="ep-right">

      <div class="ep-design" id="epDesign">
        <div class="ep-design-img" id="epDesignImg"></div>
        <div class="ep-design-info">
          <div class="ep-design-name" id="epDesignName">載入中…</div>
          <div class="ep-design-by" id="epDesignBy"></div>
        </div>
      </div>

      <div class="ep-panel" id="epPanel">
        <div class="ep-row">
          <div class="ep-label">刻圖大小 <span id="epSizeVal"></span></div>
          <input class="ep-slider" id="epSize" type="range" min="0.08" max="0.70" step="0.005" value="0.38">
        </div>
        <div class="ep-row">
          <div class="ep-label">左右位置 <span id="epXVal"></span></div>
          <input class="ep-slider" id="epX" type="range" min="-1" max="1" step="0.02" value="0">
        </div>
        <div class="ep-row">
          <div class="ep-label">上下位置 <span id="epYVal"></span></div>
          <input class="ep-slider" id="epY" type="range" min="-1" max="1" step="0.02" value="0">
        </div>
        <div class="ep-row">
          <div class="ep-label">刻圖濃度 <span id="epOpacityVal"></span></div>
          <input class="ep-slider" id="epOpacity" type="range" min="0.3" max="1" step="0.05" value="0.85">
        </div>
        <button class="ep-reset" id="epReset"><i class="fa-solid fa-rotate-left"></i> 回到預設位置</button>
      </div>

      <div class="ep-note">
        <i class="fa-solid fa-circle-info"></i>
        <span>此為示意畫面。實際雷刻的位置與呈現,以門市與您確認後為準。</span>
      </div>

    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- 不載 camera_utils:相機串流由 engrave-preview.js 自行取得與驅動 -->

<script src="js/supabase.js?v=20260513-2300"></script>
<script src="js/layout.js?v=20260513-2300"></script>
<script src="js/engrave-preview.js?v=20260809-b2"></script>
</body>
</html>
